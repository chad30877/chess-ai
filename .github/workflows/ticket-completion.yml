name: 工作票結案檢查

on:
  pull_request:
    paths:
      - '.scratch/ml-small-trial/**'
      - 'scripts/check_ticket_completion.py'
      - 'scripts/complete_ticket.py'
      - 'tests/test_ticket_completion.py'
      - 'tests/test_complete_ticket.py'
      - '.github/workflows/ticket-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ticket-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 驗證結案檢查行為
        run: python -m unittest tests.test_ticket_completion tests.test_complete_ticket
